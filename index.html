<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMB Digitale Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .title-font { font-family: 'Space Grotesk', sans-serif; }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
        .hero-bg { background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), url('https://picsum.photos/id/1015/2000/1200'); background-size: cover; background-position: center; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100">

    <!-- Navbar -->
    <nav class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="logo2.jpg" alt="IMB Digitale Agency" class="h-12 w-auto">
            </div>
            <div class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="#" class="hover:text-emerald-400 transition-colors">Accueil</a>
                <a href="#" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})" class="hover:text-emerald-400 transition-colors">Boutique</a>
                <a href="#" class="hover:text-emerald-400 transition-colors">Formations</a>
                <a href="#" class="hover:text-emerald-400 transition-colors">Contact</a>
            </div>
            <button onclick="toggleCart()" class="relative flex items-center gap-2 text-xl">
                <i class="fa-solid fa-shopping-cart"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-emerald-500 text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
            </button>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero-bg h-screen flex items-center text-center">
        <div class="max-w-4xl mx-auto px-6">
            <h1 class="title-font text-6xl md:text-7xl font-bold mb-6 text-white">IMB Digitale Agency</h1>
            <p class="text-2xl text-zinc-200 mb-10">Logiciels Premium • Formations • Solutions Digitales en Guinée</p>
            <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})" 
                    class="bg-emerald-500 hover:bg-emerald-600 px-12 py-5 rounded-3xl text-xl font-semibold transition-all">
                Découvrir la Boutique
            </button>
        </div>
    </section>

    <!-- Boutique -->
    <section id="shop" class="py-20 bg-zinc-900">
        <div class="max-w-7xl mx-auto px-6">
            <h2 class="text-5xl font-bold text-center mb-16 title-font">Nos Produits Premium</h2>
            <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
        </div>
    </section>

    <script>
        const products = [
            {id:1, name:"Microsoft Office 2021 Pro Plus", price:45000, image:"https://picsum.photos/id/201/400/280"},
            {id:2, name:"Kaspersky Total Security 2025", price:35000, image:"https://picsum.photos/id/237/400/280"},
            {id:3, name:"AutoCAD 2025 + Revit", price:135000, image:"https://picsum.photos/id/180/400/280"},
            {id:4, name:"Adobe Premiere Pro + After Effects", price:95000, image:"https://picsum.photos/id/1015/400/280"},
            {id:5, name:"Formation Montage Vidéo Pro (DaVinci Resolve)", price:32000, image:"https://picsum.photos/id/133/400/280"},
            {id:6, name:"Windows 11 Pro + Office 2021", price:55000, image:"https://picsum.photos/id/201/400/280"},
            {id:7, name:"ESET NOD32 Antivirus 2025", price:28000, image:"https://picsum.photos/id/237/400/280"},
            {id:8, name:"SolidWorks 2025 Premium", price:165000, image:"https://picsum.photos/id/180/400/280"},
            {id:9, name:"Formation SEO & Marketing Digital", price:45000, image:"https://picsum.photos/id/1015/400/280"},
            {id:10, name:"Final Cut Pro + Logic Pro X", price:75000, image:"https://picsum.photos/id/133/400/280"}
        ];

        let cart = [];

        function renderProducts() {
            const container = document.getElementById('products-grid');
            container.innerHTML = products.map(p => `
                <div class="product-card bg-zinc-800 rounded-3xl overflow-hidden cursor-pointer" onclick="addToCart(${p.id})">
                    <img src="${p.image}" class="w-full h-52 object-cover">
                    <div class="p-6">
                        <h3 class="font-semibold text-lg mb-2">${p.name}</h3>
                        <p class="text-3xl font-bold text-emerald-400">${p.price.toLocaleString()} GNF</p>
                        <button class="mt-6 w-full bg-emerald-500 hover:bg-emerald-600 py-4 rounded-2xl font-medium">Ajouter au panier</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            document.getElementById('cart-count').textContent = cart.length;
            alert(`${product.name} ajouté au panier !`);
        }

        function toggleCart() {
            if (cart.length === 0) return alert("Votre panier est vide");
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            alert(`Total du panier : ${total.toLocaleString()} GNF\n\nPaiement possible par : Carte Visa, Binance, Orange Money, MTN Money`);
            cart = [];
            document.getElementById('cart-count').textContent = 0;
        }

        window.onload = renderProducts;
    </script>
</body>
</html>
